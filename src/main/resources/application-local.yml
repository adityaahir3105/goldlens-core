spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/goldlens
    username: goldlens
    password: goldlens
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8081

# API keys (FRED_API_KEY, GEMINI_API_KEY, GOLD_API_KEY, GOLDPRICEZ_API_KEY, NEWS_API_KEY,
# GNEWS_API_KEY) come from the environment via application.yml. Never put key values here.

gold:
  backfill:
    enabled: ${GOLD_BACKFILL_ENABLED:false}
