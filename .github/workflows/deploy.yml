name: Deploy to Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_ID: goldlens-prod-2026
  REGION: asia-south1
  SERVICE: goldlens-core
  IMAGE: asia-south1-docker.pkg.dev/goldlens-prod-2026/goldlens-repo/goldlens-core
  SQL_INSTANCE: goldlens-prod-2026:asia-south1:goldlens-db
  RUNTIME_SA: goldlens-core-run@goldlens-prod-2026.iam.gserviceaccount.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: '${{ secrets.WIF_PROVIDER }}'
          service_account: '${{ secrets.SA_EMAIL }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

      - name: Build and Push Docker Image
        # gcloud builds submit exits non-zero whenever it can't read the default logs bucket
        # (needs project Viewer), even with --suppress-logs. So start the build async and poll
        # its status, which only needs cloudbuild.builds.get. Logs: Cloud Build console.
        run: |
          BUILD_ID=$(gcloud builds submit --tag ${{ env.IMAGE }}:${{ github.sha }} \
            --project=${{ env.PROJECT_ID }} --region=${{ env.REGION }} --async --format='value(id)')
          echo "Cloud Build $BUILD_ID: https://console.cloud.google.com/cloud-build/builds;region=${{ env.REGION }}/$BUILD_ID?project=${{ env.PROJECT_ID }}"
          for _ in $(seq 1 120); do
            STATUS=$(gcloud builds describe "$BUILD_ID" --project=${{ env.PROJECT_ID }} --region=${{ env.REGION }} --format='value(status)')
            case "$STATUS" in
              SUCCESS) echo "Build succeeded"; exit 0 ;;
              QUEUED|PENDING|WORKING) sleep 10 ;;
              *) echo "::error::Cloud Build $BUILD_ID finished with status $STATUS"; exit 1 ;;
            esac
          done
          echo "::error::Timed out waiting for Cloud Build $BUILD_ID"; exit 1

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}:${{ github.sha }}
          project_id: ${{ env.PROJECT_ID }}
          # Secrets come from Secret Manager (created by deploy/gcp-setup.sh), never from this file.
          # --no-cpu-throttling keeps CPU on while an instance is up so background backfills and
          # @Scheduled jobs are not starved between requests; max-instances=1 avoids duplicate runs.
          flags: |
            --service-account=${{ env.RUNTIME_SA }}
            --add-cloudsql-instances=${{ env.SQL_INSTANCE }}
            --allow-unauthenticated
            --memory=1Gi
            --cpu=1
            --no-cpu-throttling
            --min-instances=0
            --max-instances=1
            --set-env-vars=SPRING_PROFILES_ACTIVE=gcp,CLOUD_SQL_CONNECTION_NAME=${{ env.SQL_INSTANCE }},PGDATABASE=goldlens,PGUSER=goldlens_app,GOLD_BACKFILL_ENABLED=false
            --set-secrets=PGPASSWORD=goldlens-db-password:latest,ADMIN_TOKEN=goldlens-admin-token:latest,FRED_API_KEY=fred-api-key:latest,GEMINI_API_KEY=gemini-api-key:latest,GOLD_API_KEY=gold-api-key:latest,NEWS_API_KEY=news-api-key:latest,GNEWS_API_KEY=gnews-api-key:latest
