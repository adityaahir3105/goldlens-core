name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: goldlens-app-2026
  REGION: asia-south1
  SERVICE: goldlens-core
  IMAGE: asia-south1-docker.pkg.dev/goldlens-app-2026/goldlens-repo/goldlens-core

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: '${{ secrets.WIF_PROVIDER }}'
          service_account: '${{ secrets.SA_EMAIL }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

      - name: Build and Push Docker Image
        run: |
          gcloud builds submit --tag ${{ env.IMAGE }}:${{ github.sha }} --project=${{ env.PROJECT_ID }} --region=${{ env.REGION }}

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}:${{ github.sha }}
          project_id: ${{ env.PROJECT_ID }}
          flags: |
            --add-cloudsql-instances=${{ env.PROJECT_ID }}:${{ env.REGION }}:goldlens-db
            --set-env-vars=CLOUD_SQL_CONNECTION_NAME=${{ env.PROJECT_ID }}:${{ env.REGION }}:goldlens-db,PGDATABASE=goldlens,PGUSER=postgres,SPRING_PROFILES_ACTIVE=gcp
            --set-secrets=PGPASSWORD=goldlens-db-password:latest,FRED_API_KEY=fred-api-key:latest,GEMINI_API_KEY=gemini-api-key:latest,GOLDPRICEZ_API_KEY=goldpricez-api-key:latest,GOLD_API_KEY=gold-api-key:latest,NEWS_API_KEY=news-api-key:latest,GNEWS_API_KEY=gnews-api-key:latest
